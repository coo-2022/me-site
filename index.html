<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自演进。 · 个人指挥台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F5F1; --card:#FCFBF9; --ink:#1A1817; --muted:#8A857C;
  --hair:#E5E1D9; --green:#2F6F4F; --amber:#B98A2F;
  --serif:"Noto Serif SC",serif; --sans:"Noto Sans SC",sans-serif; --mono:"JetBrains Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);min-height:100vh;
  background:radial-gradient(1200px 500px at 70% -10%, #FFFFFF 0%, var(--paper) 60%)}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}

/* top bar */
header{display:flex;align-items:baseline;justify-content:space-between;padding:34px 0 0}
.wordmark{font-family:var(--serif);font-weight:900;font-size:28px;letter-spacing:.02em}
.wordmark span{color:var(--green)}
nav{display:flex;gap:22px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
nav a:hover{color:var(--ink)}
#today{color:var(--ink)}

/* hero */
.hero{padding:64px 0 40px}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(40px,6vw,72px);line-height:1.05}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{margin-top:14px;color:var(--muted);font-size:15px;max-width:52ch}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding-bottom:56px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:20px 22px;
  box-shadow:0 1px 2px rgba(26,24,23,.04)}
.card .label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.card .num{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1.15;margin-top:10px;font-variant-numeric:tabular-nums}
.card .sub{font-size:12px;color:var(--muted);margin-top:4px}
.card.pending .num{color:var(--muted)}

/* sections */
section{padding:34px 0;border-top:1px solid var(--hair)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.sec-head h2{font-family:var(--serif);font-weight:900;font-size:22px}
.sec-head .hint{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* feeds (news + agents) */
.feed{display:flex;flex-direction:column}
.feed-item{display:grid;grid-template-columns:110px 1fr;gap:18px;padding:13px 4px;border-bottom:1px dashed var(--hair);font-size:14px}
.feed-item:last-child{border-bottom:none}
.feed-item time{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.feed-item .tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--green);
  border:1px solid var(--hair);border-radius:99px;padding:1px 8px;margin-right:8px;vertical-align:1px}
.empty{border:1px dashed var(--hair);border-radius:10px;padding:26px;color:var(--muted);font-size:14px;background:var(--card)}
.empty b{color:var(--ink);font-weight:500}

/* agent status dot */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:9px;
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.proj{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:18px 20px;transition:border-color .15s}
.proj:hover{border-color:var(--green)}
.proj h3{font-family:var(--serif);font-weight:600;font-size:17px}
.proj p{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.55}
.proj .st{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--amber);text-transform:uppercase;margin-top:12px;display:block}

/* docs */
.docs{display:flex;flex-direction:column}
.doc{display:flex;justify-content:space-between;gap:16px;padding:12px 4px;border-bottom:1px dashed var(--hair);font-size:14.5px}
.doc:last-child{border-bottom:none}
.doc a{border-bottom:1px solid transparent}
.doc a:hover{color:var(--green);border-bottom-color:var(--green)}
.doc .d{color:var(--muted);font-size:12.5px;white-space:nowrap;padding-top:2px}

footer{padding:44px 0 60px;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  display:flex;justify-content:space-between;border-top:1px solid var(--hair)}
footer a:hover{color:var(--ink)}

@media (max-width:640px){
  .hero{padding:44px 0 32px}
  .feed-item{grid-template-columns:1fr;gap:4px}
  header{flex-direction:column;gap:12px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="wordmark">自演进<span>。</span></div>
  <nav>
    <span id="today"></span>
    <a href="./garden/">花园</a>
    <a href="https://github.com/coo-2022/me-archive">档案库</a>
  </nav>
</header>

<div class="hero">
  <h1>数据化 × 元能力<br>× <em>衡量标准</em></h1>
  <p>个人指挥台:每日情报、AI 马仔动向、在做项目与调研档案。所有数字由归档管线自动统计。</p>
</div>

<div class="stats" id="stats">
  <div class="card"><div class="label">调研文档</div><div class="num" id="n-docs">–</div><div class="sub">corpus/research</div></div>
  <div class="card"><div class="label">在做项目</div><div class="num" id="n-projects">–</div><div class="sub">进行中</div></div>
  <div class="card"><div class="label">归档对话</div><div class="num" id="n-chats">–</div><div class="sub">条,已脱敏</div></div>
  <div class="card pending"><div class="label">情报源</div><div class="num" id="n-sources">0</div><div class="sub">待接入 daily-news</div></div>
</div>

<section id="news">
  <div class="sec-head"><h2>今日情报</h2><span class="hint">daily briefing</span></div>
  <div id="news-body"></div>
</section>

<section id="agents">
  <div class="sec-head"><h2><span class="dot"></span>马仔动向</h2><span class="hint">agent activity</span></div>
  <div id="agents-body"></div>
</section>

<section id="projects-sec">
  <div class="sec-head"><h2>在做项目</h2><span class="hint">active projects</span></div>
  <div class="projects" id="projects-body"></div>
</section>

<section id="docs-sec">
  <div class="sec-head"><h2>调研档案</h2><span class="hint">research</span></div>
  <div class="docs" id="docs-body"></div>
</section>

<footer>
  <span>me-archive · 私有全量,公开子集</span>
  <a href="./garden/">进入数字花园 →</a>
</footer>

</div>

<script>
const $=id=>document.getElementById(id);
$("today").textContent=new Date().toLocaleDateString("zh-CN",{month:"long",day:"numeric",weekday:"short"});

fetch("./data.json").then(r=>r.json()).then(d=>{
  $("n-docs").textContent=d.stats.docs;
  $("n-projects").textContent=d.stats.projects;
  $("n-chats").textContent=d.stats.chats.toLocaleString("zh-CN");
  $("n-sources").textContent=d.stats.sources;

  const feed=(items,empty)=> items&&items.length
    ? `<div class="feed">${items.map(i=>`<div class="feed-item"><time>${i.time}</time><div>${i.tag?`<span class="tag">${i.tag}</span>`:""}${i.link?`<a href="${i.link}">${i.text}</a>`:i.text}</div></div>`).join("")}</div>`
    : `<div class="empty">${empty}</div>`;

  $("news-body").innerHTML=feed(d.news,
    "<b>情报管线尚未接入。</b> daily-news 能力上线后,每天筛选后的 Twitter / 知乎 / arXiv / HuggingFace 情报会出现在这里。");
  $("agents-body").innerHTML=feed(d.agents,
    "<b>暂无马仔活动。</b> AI 代理的执行记录会实时归档到这里。");

  $("projects-body").innerHTML=d.projects.map(p=>
    `<div class="proj"><h3>${p.name}</h3><p>${p.desc}</p><span class="st">${p.status}</span></div>`).join("");

  $("docs-body").innerHTML=d.docs.map(x=>
    `<div class="doc"><a href="${x.link}">${x.title}</a><span class="d">${x.date}</span></div>`).join("");
}).catch(()=>{
  $("news-body").innerHTML='<div class="empty">data.json 加载失败——构建管线可能未生成数据。</div>';
});
</script>
</body>
</html>
